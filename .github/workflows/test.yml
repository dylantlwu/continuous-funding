name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Mixed margin and unit types must not compile (T4)
        run: bash script/check-compile-fail.sh

      - name: Golden vectors regenerate identically (T10 reference)
        run: python3 -m validation.onchain_ref && git diff --exit-code test/golden

      - name: Python validation tests
        run: python3 -m unittest discover -s validation/tests -t .

      - name: Run Forge tests
        run: forge test -vvv
