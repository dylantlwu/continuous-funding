[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"          # Monad supports opcodes up to Fusaka (docs.monad.xyz, Deployment Summary)
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
]
fs_permissions = [{ access = "read", path = "./test/golden" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
