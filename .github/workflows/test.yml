name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Mixed margin and unit types must not compile (T4)
        run: bash script/check-compile-fail.sh

      - name: Golden vectors regenerate identically (T10 reference)
        run: python3 -m validation.onchain_ref && git diff --exit-code test/golden

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Front-end types and tests (ABI regenerated from this build)
        run: |
          npm ci --prefix frontend
          node frontend/scripts/gen-abi.mjs
          npx --prefix frontend tsc -p frontend/tsconfig.json
          npm test --prefix frontend

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Python tests (research engine, recorder, relayer, keeper)
        run: |
          python -m pip install -r validation/requirements.txt
          python -m unittest discover -s validation/tests -t .

      - name: Run Forge tests
        run: forge test -vvv
